name: Actualizar datos macro a diario
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    # --- AÑADE ESTAS DOS LÍNEAS AQUÍ ---
    permissions:
      contents: write
    # ------------------------------------
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v3
        
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: pip install -r requirements.txt
        
      - name: Ejecutar script de datos
        run: python fetch_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          
      - name: Guardar data.json en el repositorio
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data.json
          git commit -m "Actualización diaria automática de datos" || echo "No hay cambios"
          git push
